# ---------------------------------------------------------------
# nginx.conf : frontend container ke andar nginx ki settings
# ---------------------------------------------------------------
server {
  listen 80;

  # React ki build ki hui files yahan rakhi hoti hain (Dockerfile mein copy hoti hain)
  root /usr/share/nginx/html;
  index index.html;

  # Normal pages: file mile to dikhao, warna index.html do (React ke liye)
  location / {
    try_files $uri /index.html;
  }

  # Jo request /api/ se shuru ho, usay backend container ko bhej do.
  # "backend" = compose.yaml mein backend service ka naam.
  # Docker ka DNS is naam ko backend container ki IP bana deta hai.
  location /api/ {
    proxy_pass http://backend:5000;
  }
}
